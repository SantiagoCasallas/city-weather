spring.application.name=city-weather
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
weather.geocoding-url=${GEOCODING_URL:https://geocoding-api.open-meteo.com}
weather.forecast-url=${FORECAST_URL:https://api.open-meteo.com}
weather.timeout-ms=${PROVIDER_TIMEOUT_MS:5000}
weather.cache-seconds=${CACHE_TTL_SECONDS:600}
weather.cache-size=${CACHE_MAX_ENTRIES:500}
